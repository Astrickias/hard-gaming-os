# Minimale pacman-Konfiguration für hgos-branding: nur lokale Paketdatenbank,
# keine Online-Repos. So braucht die Installation weder Netz noch Schlüsselbund
# (im mkarchiso-Chroot existiert noch keiner).
[options]
Architecture = auto
HoldPkg = pacman glibc
SigLevel = Never
LocalFileSigLevel = Optional
