# Hard Gaming Konsole – Einstellungen (Shell-Syntax).
# Eigene Werte pro Benutzer: ~/.config/hard-gaming-konsole.conf (gleiches Format).

# Grafikkarte: auto (NVIDIA bevorzugen, falls vorhanden) | dgpu | igpu
# „igpu“ nur nutzen, wenn die interne Grafik genug Speicher hat – kleine iGPUs
# (z. B. Radeon 610M) laufen sonst voll und das System kann einfrieren.
KONSOLE_GPU=auto

# Auflösung im Fenster-Modus (Test vom Desktop aus)
KONSOLE_FENSTER_BREITE=1280
KONSOLE_FENSTER_HOEHE=720

# Zusätzliche gamescope-Optionen, z. B. "--adaptive-sync --hdr-enabled"
KONSOLE_GAMESCOPE_EXTRA=""

# Bricht die Konsolen-Sitzung in den ersten Sekunden ab, startet automatisch
# der normale Desktop (1 = an, 0 = aus).
KONSOLE_DESKTOP_FALLBACK=1
